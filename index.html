<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay</title>
<meta name="description" content="Pass the book. Keep the context. Your inherited book, ranked, with the ninety second brief in your ear.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#FAF9F5;--ink:#141413;--surface:#fff;--line:#E8E5DC;--muted:#5E5D59;--glaze:#F2EFE6;
--run:#C2573A;--protect:#D9A23B;--expand:#4E8F6A;--watch:#8A867E;
--d:"Instrument Sans",Arial,sans-serif;--s:"Source Serif 4",Georgia,serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--ink:#F1EEE6;--surface:#1F1D19;--line:#2E2B25;--muted:#A8A49B;--glaze:#24221D}}
:root[data-theme="dark"]{--bg:#161512;--ink:#F1EEE6;--surface:#1F1D19;--line:#2E2B25;--muted:#A8A49B;--glaze:#24221D}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--s);font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:36px 16px 60px}
.mono{font-family:var(--d);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--d);font-size:38px;font-weight:600;letter-spacing:-.03em;margin:6px 0 4px}
h2{font-family:var(--d);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.sub{font-family:var(--d);font-size:14px;color:var(--muted);margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 13px}
.tile b{display:block;font-family:var(--d);font-size:20px;font-weight:600;letter-spacing:-.02em}
.tile span{font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.player{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 18px 14px;margin:0 0 8px}
.player .theme{font-family:var(--d);font-size:16px;font-weight:600;letter-spacing:-.01em;margin:2px 0 10px}
.player audio{width:100%;display:block}
.player .none{font-family:var(--d);font-size:13px;color:var(--muted)}
.brief{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 24px;font-size:18px;line-height:1.55;white-space:pre-wrap}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:640px}
th{font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line);font-family:var(--d);font-size:13.5px;vertical-align:middle}
tr:first-child td{border-top:0}
td.rk{color:#A5A199;font-size:10px;width:30px;text-align:right}
td.sc{font-size:16px;font-weight:600;width:44px;text-align:right;font-variant-numeric:tabular-nums}
td b{display:block;font-size:14px;font-weight:600}
td span{font-size:11.5px;color:var(--muted)}
td.n{width:62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
td.ct{width:84px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.foot{margin-top:16px;font-family:var(--d);font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--run);color:var(--run);border-radius:999px;padding:1px 9px;font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.past{list-style:none;padding:0;margin:0;font-family:var(--d);font-size:13px}
.past li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.past li:first-child{border-top:0}
.past .d{color:var(--muted);min-width:56px}
.past a{color:inherit}
</style></head><body><div class="wrap">
<div class="mono" id="stamp">Relay</div>
<h1 id="title">Relay</h1>
<p class="sub" id="sub">Loading the book…</p>

<h2>The brief</h2>
<div class="player" id="player"><div class="none">No episode yet.</div></div>
<div class="brief" id="brief" hidden></div>

<h2>The book</h2>
<div class="tiles" id="tiles"></div>
<div class="tablewrap"><table id="table"><tr><th></th><th>Score</th><th>Account</th><th>Renew</th><th>Spend</th><th>Health</th><th></th></tr></table></div>
<p class="foot" id="foot"></p>

<h2>Past briefs</h2>
<ul class="past" id="past"><li class="none">None yet.</li></ul>
</div>
<script>
(async function(){
  const CAT={"Run now":"var(--run)","Protect":"var(--protect)","Expand":"var(--expand)","Watch":"var(--watch)"};
  const BAND={low:"var(--run)",mid:"var(--protect)",high:"var(--expand)"};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const bust="?v="+Date.now();
  let dash=null, eps=[];
  try{dash=await (await fetch("dashboard.json"+bust)).json();}catch(e){}
  try{eps=await (await fetch("episodes.json"+bust)).json();}catch(e){}

  if(dash){
    document.title="Relay · "+dash.title;
    document.getElementById("stamp").textContent="Relay · generated "+dash.generated;
    document.getElementById("title").textContent=dash.title;
    document.getElementById("sub").textContent=dash.accounts+" accounts · "+dash.total+" · "+dash.weighting+" Higher is better, so the book opens on its weakest accounts.";
    document.getElementById("tiles").innerHTML=dash.tiles.map(t=>'<div class="tile"><b style="color:'+CAT[t.category]+'">'+esc(t.total)+'</b><span>'+esc(t.category)+'</span></div>').join("");
    const tb=document.getElementById("table");
    tb.insertAdjacentHTML("beforeend",dash.rows.map(r=>'<tr><td class="rk">'+r.rank+'</td><td class="sc" style="color:'+BAND[r.band]+'">'+r.score+'</td><td><b>'+esc(r.name)+'</b><span>'+esc(r.arr)+' · renews in '+r.days+' days</span></td><td class="n">'+r.renewal+'</td><td class="n">'+r.spend+'</td><td class="n">'+r.health+'</td><td class="ct" style="color:'+CAT[r.category]+'">'+esc(r.category)+'</td></tr>').join(""));
    document.getElementById("foot").innerHTML=(dash.dummy?'<span class="pill">Dummy data</span>':'<span class="pill">Check the data</span>')+"Scores are renewal, spend and health averaged. Higher is better. Where the record and the rep notes disagree, trust the notes and verify before the call.";
    if(dash.brief){const b=document.getElementById("brief");b.textContent=dash.brief;b.hidden=false;}
  }else{
    document.getElementById("sub").textContent="No book yet. Run /relay and it will land here.";
  }

  if(eps.length){
    const e=eps[0];
    document.getElementById("player").innerHTML='<div class="mono">'+esc(e.date)+(e.dur?' · '+Math.floor(e.dur/60)+':'+String(e.dur%60).padStart(2,"0"):'')+'</div><div class="theme">'+esc(e.theme)+'</div><audio controls preload="metadata" src="'+esc(e.file)+'"></audio>';
    document.getElementById("past").innerHTML=eps.map(x=>'<li><span class="d">'+esc(x.short||x.date)+'</span><a href="'+esc(x.file)+'">'+esc(x.theme)+'</a></li>').join("");
  }
})();
</script>
</body></html>
